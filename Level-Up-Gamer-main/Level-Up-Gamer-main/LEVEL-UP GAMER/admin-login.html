<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Restringido - LEVEL-UP GAMER</title>
    <!-- Google Fonts y Bootstrap -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="estilo_pagina.css">
</head>
<body class="bg-black text-white d-flex align-items-center justify-content-center" style="min-height: 100vh;">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-6 col-lg-4">
                <div class="gamer-card p-4 p-md-5 border-electric text-center">
                    <h3 class="fw-bold hero-title text-danger mb-2 font-orbitron">ACCESO ADMIN</h3>
                    <p class="text-secondary small mb-4">Portal exclusivo para personal autorizado.</p>
                    
                    <form id="admin-login-form">
                        <div class="mb-3 text-start">
                            <label class="form-label text-light small">Usuario Administrador:</label>
                            <input type="text" class="form-control gamer-input" id="adminUser" required placeholder="Ej: admin_root">
                        </div>
                        <div class="mb-4 text-start">
                            <label class="form-label text-light small">Contraseña:</label>
                            <input type="password" class="form-control gamer-input" id="adminPass" required placeholder="••••••••">
                        </div>
                        <button type="submit" class="btn btn-danger w-100 py-2 fw-bold font-orbitron">Iniciar Sesión</button>
                        <a href="LEVEL-UP GAMER.html" class="d-block mt-3 text-secondary small text-decoration-none">← Volver a la tienda</a>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Lógica básica de validación para el login de administrador
        document.getElementById('admin-login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const user = document.getElementById('adminUser').value;
            const pass = document.getElementById('adminPass').value;

            // Credenciales de prueba
            if(user === "admin" && pass === "12345") {
                alert("Acceso concedido. Bienvenido al panel de control.");
            } else {
                alert("Credenciales incorrectas. Acceso denegado.");
            }
        });
    </script>
</body>
</html>
